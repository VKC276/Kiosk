<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
  <title>Västerviks klättercenter Kiosk</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
      box-sizing: border-box;
      cursor: none !important;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    .rotator-section {
      height: 80%;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .rotator-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .rotator-slide.active {
      opacity: 1;
    }

    .rotator-slide iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #f0f0f0;
    }

    .card-reader-section {
      height: 20%;
      width: 100%;
      box-sizing: border-box;
      background-color: #ffffff;
      border-top: 5px solid #ccc;
      padding: 0;
    }

    .card-reader-section iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="main-container">

    <div class="rotator-section">

      <div class="rotator-slide active" data-duration="100000" id="top-sends-slide">
        <iframe
          id="diagram_rotator_iframe"
          src="https://script.google.com/macros/s/AKfycbx7j97ZTc747SpoWU3GF3Kv9d9RLwJiqtHpXRYaYSm1emcExqvUtYyr4A-m9CNJ5ddSxw/exec"
          data-base="https://script.google.com/macros/s/AKfycbx7j97ZTc747SpoWU3GF3Kv9d9RLwJiqtHpXRYaYSm1emcExqvUtYyr4A-m9CNJ5ddSxw/exec"
          title="Topp Senders per led (Roterar internt)">
        </iframe>
      </div>

      <div class="rotator-slide" data-duration="30000" id="charts-slide">
        <iframe
          id="diagram_rotator2_iframe"
          src="diagram_rotator.html"
          data-base="diagram_rotator.html"
          title="Roterande statistikdiagram">
        </iframe>
      </div>

    </div>

    <div class="card-reader-section">
      <iframe
        src="http://localhost:8081"
        title="MIFARE Kortläsarstatus"
        loading="eager">
      </iframe>
    </div>

  </div>

  <script>
    const slides = document.querySelectorAll('.rotator-slide');
    let currentSlideIndex = 0;
    let slideTimer;

    function refreshIframe(iframe) {
      if (iframe) {
        const baseUrl = iframe.getAttribute('data-base') || iframe.src.split('?')[0];
        const newSrc = baseUrl + `?refresh=${Date.now()}`;
        console.log(`🔄 Uppdaterar iframe '${iframe.id}' med ny src: ${newSrc}`);
        iframe.src = newSrc;
      } else {
        console.warn('⚠️ Ingen iframe att uppdatera.');
      }
    }

    function getSlideDuration(index) {
      const duration = parseInt(slides[index].getAttribute('data-duration')) || 30000;
      console.log(`⏱ Slide ${index} har duration: ${duration} ms`);
      return duration;
    }

    function setSlide(index) {
      console.log(`📺 Byter till slide ${index}`);
      slides[currentSlideIndex].classList.remove('active');
      currentSlideIndex = index;
      slides[currentSlideIndex].classList.add('active');

      const activeSlide = slides[currentSlideIndex];
      const iframesToRefresh = activeSlide.querySelectorAll('iframe');

      if (iframesToRefresh.length > 0) {
        console.log(`🔍 Hittade ${iframesToRefresh.length} iframe(s) i slide ${index}`);
        iframesToRefresh.forEach((iframe) => {
          console.log(`↪️ Förbereder uppdatering av iframe '${iframe.id}'`);
          refreshIframe(iframe);
        });
      } else {
        console.log(`ℹ️ Ingen iframe att uppdatera i slide ${index}`);
      }

      clearTimeout(slideTimer);
      const duration = getSlideDuration(currentSlideIndex);
      slideTimer = setTimeout(nextSlide, duration);
    }

    function nextSlide() {
      const nextIndex = (currentSlideIndex + 1) % slides.length;
      console.log(`➡️ Nästa slide blir ${nextIndex}`);
      setSlide(nextIndex);
    }

    document.addEventListener('DOMContentLoaded', () => {
      console.log('🚀 DOM laddad, startar slideshow...');
      if (slides.length > 0) {
        setSlide(0);
      } else {
        console.error('❌ Inga slides hittades!');
      }
    });
  </script>
</body>
</html>
