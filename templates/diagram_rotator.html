<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Roterande Diagramvisning</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }

    .chart-rotator {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .chart-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      background-color: white;
    }

    .chart-slide.active {
      opacity: 1;
    }

    .chart-slide iframe {
      width: 100%;
      height: 100%;
      border: none;
      padding: 15px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="chart-rotator">
    {% for chart in charts %}
    <div class="chart-slide{% if loop.first %} active{% endif %}" id="chart-{{ loop.index }}">
      <iframe
        src="{{ chart.url }}"
        title="{{ chart.title }}"
        loading="{% if loop.first %}eager{% else %}lazy{% endif %}"
      ></iframe>
    </div>
    {% endfor %}
  </div>

  <script>
    const slides = document.querySelectorAll('.chart-slide');
    const intervalTime = {{ interval_ms|int }};
    let currentIndex = 0;

    function showNextSlide() {
      if (slides.length < 2) return;
      slides[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % slides.length;
      slides[currentIndex].classList.add('active');
    }

    if (slides.length > 1) {
      setInterval(showNextSlide, intervalTime);
    }
  </script>
</body>
</html>
